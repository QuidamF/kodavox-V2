services:
  # TTS Service (XTTS-v2) - Mantenido como microservicio de streaming
  tts-service:
    build: ./services/tts
    container_name: tts-service
    ports:
      - "8001:8000"
    volumes:
      - ./services/tts/app:/app/app
      - ./services/tts/voices:/app/voices
      - ./services/tts/db:/app/db
      - ./services/tts/latents:/app/latents
      - tts_models:/root/.local/share/tts
      - huggingface_cache:/root/.cache/huggingface
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]

  # KodaVox V2 Monolithic Engine (VAD + STT + Orchestrator)
  kodavox-engine:
    build: 
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: kodavox-engine
    # Utilizamos network_mode: host para facilitar el acceso a PyAudio/ALSA a la red local y al micrófono
    network_mode: "host"
    environment:
      - OLLAMA_HOST=http://127.0.0.1:11434
    env_file:
      - .env
    volumes:
      - ./orchestrator:/app
    # Privilegiado y mapeo de dispositivos de audio (Linux/Ubuntu)
    privileged: true
    devices:
      - "/dev/snd:/dev/snd"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [ gpu ]

  # Redis Cache Service - Caching de preguntas/respuestas frecuentes y audios PCM
  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  tts_models:
  huggingface_cache:
  redis_data:
